<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond badge arrondi moderne -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>

  <!-- Grille & Cercles de Zone Optimale (ZPD) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="28" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="14" fill="rgba(59, 130, 246, 0.15)" stroke="#60a5fa" stroke-width="1"/>

  <!-- Axes orthogonaux fins -->
  <line x1="22" y1="60" x2="98" y2="60" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="60" y1="22" x2="60" y2="98" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Lettre Z stylisée / Éclair géométrique & mathématique -->
  <path d="M36 40 L84 40 L44 80 L84 80" fill="none" stroke="url(#zGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Point focal / Cible d'apprentissage (Centre ZPD) -->
  <circle cx="60" cy="60" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Symbole Mathématique petit exposant (+ / angle) -->
  <path d="M78 32 L86 32 M82 28 L82 36" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
